<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベッド管理 | アスポート</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#f0f4f8;--white:#fff;--surface:#f8fafc;
  --border:#e2e8f0;--border2:#cbd5e1;
  --accent:#0ea5e9;--accent-dark:#0284c7;
  --green:#16a34a;--green-l:#f0fdf4;--green-b:#86efac;
  --yellow:#d97706;--yellow-l:#fffbeb;--yellow-b:#fde68a;
  --red:#dc2626;--red-l:#fef2f2;--red-b:#fecaca;
  --orange:#ea580c;--orange-l:#fff7ed;--orange-b:#fed7aa;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --purple:#7c3aed;--purple-l:#f5f3ff;--purple-b:#ddd6fe;
  --teal:#0d9488;--teal-l:#f0fdfa;--teal-b:#99f6e4;
  --pink:#db2777;--pink-l:#fdf2f8;--pink-b:#fbcfe8;
  --gray:#64748b;--gray2:#94a3b8;--text:#0f172a;--text2:#475569;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;}

header{background:var(--white);border-bottom:1px solid var(--border);padding:0 16px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.logo{font-size:15px;font-weight:700;color:var(--accent-dark);}
.logo span{font-size:12px;color:var(--gray);font-weight:400;margin-left:6px;}
.sync-area{display:flex;align-items:center;gap:10px;}
#sync-status{font-size:11px;color:var(--gray2);}
#hdate{font-size:11px;color:var(--gray);}

.tab-bar{display:flex;background:var(--white);border-bottom:2px solid var(--border);padding:0 12px;overflow-x:auto;}
.tab-btn{padding:11px 12px;font-size:13px;font-weight:500;color:var(--gray);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;align-items:center;gap:5px;font-family:inherit;white-space:nowrap;}
.tab-btn.active{color:var(--accent-dark);border-bottom-color:var(--accent);}
.tc{border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px;font-family:'DM Mono',monospace;min-width:18px;text-align:center;background:var(--border);color:var(--gray);}
.tc.g{background:var(--green-l);color:var(--green);}
.tc.y{background:var(--yellow-l);color:var(--yellow);}

main{max-width:980px;margin:0 auto;padding:16px;}
.page{display:none;}
.page.active{display:block;}

/* 共通 */
.section-title{font-size:16px;font-weight:700;margin-bottom:14px;}
.btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none;transition:all .12s;display:inline-flex;align-items:center;gap:5px;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--accent-dark);}
.btn-green{background:var(--green);color:#fff;}.btn-green:hover{background:#15803d;}
.btn-teal{background:var(--teal);color:#fff;}.btn-teal:hover{background:#0f766e;}
.btn-red{background:var(--red-l);color:var(--red);border:1px solid var(--red-b);}.btn-red:hover{background:var(--red);color:#fff;}
.btn-ghost{background:var(--surface);color:var(--gray);border:1px solid var(--border2);}.btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);}
.btn-sm{padding:5px 10px;font-size:12px;}

/* フィルター */
.av-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.av-title{font-size:16px;font-weight:700;}
.av-total{font-size:13px;color:var(--gray);background:var(--white);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-family:'DM Mono',monospace;}
.filter-section{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
.filter-row-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--gray2);text-transform:uppercase;margin-bottom:6px;}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.filter-row:last-child{margin-bottom:0;}
.flt-btn{padding:6px 12px;border-radius:999px;border:1.5px solid var(--border2);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--gray);transition:all .12s;}
.flt-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.flt-btn.on-p{background:var(--purple);border-color:var(--purple);color:#fff;}
.filter-clear{font-size:11px;color:var(--gray);background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:underline;padding:0;}

/* タグ */
.maker-section{margin-bottom:18px;}
.maker-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gray2);text-transform:uppercase;margin-bottom:8px;padding-left:2px;}
.series-group{margin-bottom:12px;}
.series-group-header{display:flex;align-items:center;gap:8px;margin-bottom:7px;padding-left:2px;}
.series-group-name{font-size:14px;font-weight:700;}
.sg-cnt{font-size:11px;font-family:'DM Mono',monospace;border-radius:999px;padding:1px 8px;font-weight:700;}
.sg-green{background:var(--green-l);color:var(--green);border:1px solid var(--green-b);}
.sg-purple{background:var(--purple-l);color:var(--purple);border:1px solid var(--purple-b);}
.bed-tags{display:flex;flex-wrap:wrap;gap:8px;}
.bed-tag{display:inline-flex;flex-direction:column;background:var(--white);border:1.5px solid var(--green-b);border-radius:10px;padding:8px 10px;cursor:pointer;transition:all .15s;user-select:none;min-width:100px;gap:4px;position:relative;}
.bed-tag:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(22,163,74,.15);transform:translateY(-1px);}
.bed-tag.reserved{border-color:var(--purple-b);background:var(--purple-l);}
.bed-tag.reserved:hover{border-color:var(--purple);}
.bed-tag.flexible{border-style:dashed;}
.reserved-badge{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--purple);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(124,58,237,.4);}
.flexible-badge{position:absolute;top:-7px;right:6px;background:var(--teal);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:999px;}
.bed-tag-spec{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.bed-tag-motor{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:var(--green);}
.bed-tag.reserved .bed-tag-motor{color:var(--purple);}
.bed-tag-width{font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:var(--text2);background:var(--surface);border:1px solid var(--border2);border-radius:4px;padding:0 5px;}
.bed-tag-len{font-family:'DM Mono',monospace;font-size:10px;color:var(--teal);background:var(--teal-l);border:1px solid var(--teal-b);border-radius:4px;padding:0 4px;font-weight:600;}
.bed-tag-badges{display:flex;gap:4px;flex-wrap:wrap;}
.mini-badge{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;white-space:nowrap;}
.mb-bip{background:#dcfce7;color:var(--green);}
.mb-nor{background:var(--blue-l);color:var(--blue);}
.mb-bad{background:var(--orange-l);color:var(--orange);}
.mb-rep{background:var(--red-l);color:var(--red);}
.mb-ok{background:var(--green-l);color:var(--green);}
.mb-ask{background:var(--yellow-l);color:var(--yellow);}
.mb-ins{background:var(--blue-l);color:var(--blue);}
/* 色バッジ */
.color-badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;}
.cb-white{background:#f8fafc;color:#475569;border:1px solid #cbd5e1;}
.cb-pink{background:var(--pink-l);color:var(--pink);border:1px solid var(--pink-b);}
.cb-green{background:var(--green-l);color:var(--green);border:1px solid var(--green-b);}
.bed-tag-note{font-size:10px;color:var(--gray);border-top:1px solid var(--border);padding-top:3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
.bed-tag-reserve-info{font-size:10px;color:var(--purple);font-weight:600;border-top:1px solid var(--purple-b);padding-top:3px;}

/* 清掃中 */
.cl-page-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.cl-legend{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--gray);}
.legend-dot{width:10px;height:10px;border-radius:50%;}
.storage-section{margin-bottom:20px;}
.section-header{font-size:13px;font-weight:700;border-radius:10px;padding:8px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sh-teal{color:var(--teal);background:var(--teal-l);border:1px solid var(--teal-b);}
.sh-yellow{color:var(--yellow);background:var(--yellow-l);border:1px solid var(--yellow-b);}
.storage-list,.cleaning-list{display:flex;flex-direction:column;gap:8px;}
.storage-card{background:var(--white);border:2px solid var(--teal-b);border-radius:11px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.storage-info{flex:1;min-width:0;}
.storage-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.storage-tags{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0;}
.storage-meta{font-size:11px;color:var(--gray2);}
.storage-note{font-size:11px;color:var(--orange);margin-top:2px;}
.cl-card{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:12px 14px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;}
.cl-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;}
.pri-1::before{background:#dc2626;}.pri-2::before{background:#f97316;}.pri-3::before{background:#eab308;}.pri-4::before{background:#94a3b8;}
.cl-num{width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:4px;}
.pn-1{background:#fef2f2;color:#dc2626;border:2px solid #fecaca;}
.pn-2{background:#fff7ed;color:#f97316;border:2px solid #fed7aa;}
.pn-3{background:#fefce8;color:#ca8a04;border:2px solid #fef08a;}
.pn-4{background:var(--surface);color:var(--gray2);border:2px solid var(--border2);}
.cl-info{flex:1;min-width:0;}
.cl-name{font-size:14px;font-weight:700;margin-bottom:3px;}
.cl-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:3px;}
.cl-sub{font-size:11px;color:var(--gray2);}
.badge-cl{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--yellow-l);color:var(--yellow);border:1px solid var(--yellow-b);white-space:nowrap;}
.badge-cl::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--yellow);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* 返却受付 */
.return-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px;}
.step-block{padding:12px 0;border-bottom:1px solid var(--border);}
.step-block:last-of-type{border-bottom:none;}
.step-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.snum{width:23px;height:23px;border-radius:50%;background:var(--border2);color:var(--gray);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.snum.done{background:var(--accent);color:#fff;}
.snum.act{background:var(--accent-dark);color:#fff;}
.sname{font-size:13px;font-weight:600;color:var(--gray);}
.sname.act{color:var(--text);}
.sval{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent-dark);background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.3);border-radius:6px;padding:2px 9px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border2);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .12s;font-family:inherit;}
.chip:hover{border-color:var(--accent);color:var(--accent-dark);}
.chip.sel{background:rgba(14,165,233,.12);border-color:var(--accent);color:var(--accent-dark);font-weight:700;}
/* 状態チップ */
.state-chip{padding:9px 13px;border-radius:10px;border:2px solid var(--border2);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px;}
.state-chip small{font-size:10px;font-weight:500;color:var(--gray);}
.state-chip[data-s="美品"].sel{background:var(--green-l);border-color:var(--green);color:var(--green);}
.state-chip[data-s="普通"].sel{background:var(--blue-l);border-color:var(--blue);color:var(--blue);}
.state-chip[data-s="程度悪"].sel{background:var(--orange-l);border-color:var(--orange);color:var(--orange);}
.state-chip[data-s="要修理"].sel{background:var(--red-l);border-color:var(--red);color:var(--red);}
/* 実費チップ */
.cost-chip{padding:9px 13px;border-radius:10px;border:2px solid var(--border2);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:86px;}
.cost-chip small{font-size:10px;font-weight:500;color:var(--gray);}
.cost-chip[data-cost="実費対応"].sel{background:var(--green-l);border-color:var(--green);color:var(--green);}
.cost-chip[data-cost="要相談"].sel{background:var(--yellow-l);border-color:var(--yellow);color:var(--yellow);}
.cost-chip[data-cost="保険対応のみ"].sel{background:var(--blue-l);border-color:var(--blue);color:var(--blue);}
.cost-hint-r{margin-top:6px;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;display:none;align-items:center;gap:5px;}
.cost-hint-r.show{display:flex;}
.cost-hint-r.h-ok{background:var(--green-l);color:var(--green);border:1px solid var(--green-b);}
.cost-hint-r.h-ng{background:var(--blue-l);color:var(--blue);border:1px solid var(--blue-b);}
.cost-hint-r.h-ask{background:var(--yellow-l);color:var(--yellow);border:1px solid var(--yellow-b);}
/* 色チップ */
.color-chip{padding:9px 16px;border-radius:10px;border:2px solid var(--border2);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s;}
.color-chip[data-color="白"].sel{background:#f1f5f9;border-color:#94a3b8;color:#334155;}
.color-chip[data-color="ピンク"].sel{background:var(--pink-l);border-color:var(--pink);color:var(--pink);}
.color-chip[data-color="グリーン"].sel{background:var(--green-l);border-color:var(--green);color:var(--green);}
/* テキストエリア */
.form-textarea{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid var(--border2);background:var(--white);font-size:13px;font-family:inherit;color:var(--text);outline:none;resize:none;transition:border-color .12s;}
.form-textarea:focus{border-color:var(--accent);}

.locked{opacity:.35;pointer-events:none;}
.sum-box{background:var(--surface);border:1.5px dashed var(--border2);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:44px;}
.sum-tag{background:var(--white);border:1px solid var(--border2);border-radius:6px;padding:2px 9px;font-size:12px;font-weight:600;}
.sum-empty{color:var(--gray);font-size:13px;}
.submit-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;}
.submit-btn:hover:not(:disabled){background:var(--accent-dark);}
.submit-btn:disabled{background:var(--border2);color:var(--gray);cursor:not-allowed;}
.reset-lnk{text-align:center;margin-top:7px;}
.reset-lnk button{background:none;border:none;color:var(--gray);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;}

/* 設定 */
.settings-maker{margin-bottom:20px;}
.settings-maker-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.settings-maker-name{font-size:15px;font-weight:700;}
.series-setting-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.series-setting-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.series-setting-name{font-size:14px;font-weight:600;}
.series-specs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:5px;}
.spec-tag-s{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--white);border:1px solid var(--border2);color:var(--text2);}
.spec-tag-s.flex{background:var(--teal-l);color:var(--teal);border-color:var(--teal-b);}
.spec-tag-s.cost-ok{background:var(--green-l);color:var(--green);border-color:var(--green-b);}
.spec-tag-s.cost-ask{background:var(--yellow-l);color:var(--yellow);border-color:var(--yellow-b);}
.spec-tag-s.cost-ins{background:var(--blue-l);color:var(--blue);border-color:var(--blue-b);}
.series-spec-text{font-size:11px;color:var(--gray);font-style:italic;margin-top:2px;}

/* フォーム */
.form-group{margin-bottom:13px;}
.form-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;display:block;}
.form-input,.form-select{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid var(--border2);background:var(--white);font-size:13px;font-family:inherit;color:var(--text);outline:none;transition:border-color .12s;}
.form-input:focus,.form-select:focus{border-color:var(--accent);}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
.toggle-label{font-size:13px;font-weight:500;}
.toggle{position:relative;width:42px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--border2);border-radius:12px;cursor:pointer;transition:background .2s;}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle input:checked + .toggle-slider{background:var(--accent);}
.toggle input:checked + .toggle-slider::before{transform:translateX(18px);}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;}
.check-chip{padding:6px 12px;border-radius:999px;border:1.5px solid var(--border2);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Mono',monospace;color:var(--text2);transition:all .12s;user-select:none;}
.check-chip.on{background:rgba(14,165,233,.12);border-color:var(--accent);color:var(--accent-dark);}

/* ポップアップ */
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;}
.popup.open{display:flex;}
.popup-box{background:var(--white);border-radius:16px;padding:24px;width:360px;max-width:95vw;box-shadow:0 8px 32px rgba(0,0,0,.18);max-height:92vh;overflow-y:auto;}
.popup-title{font-size:17px;font-weight:700;margin-bottom:4px;}
.popup-sub{font-size:13px;color:var(--gray);margin-bottom:14px;}
.detail-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.detail-label{font-size:12px;color:var(--gray);width:60px;flex-shrink:0;padding-top:1px;}
.detail-val{font-size:13px;font-weight:600;flex:1;}
.pop-btn-group{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.pop-btn{width:100%;padding:11px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .12s;}
.pop-btn-ship{background:var(--green);color:#fff;}.pop-btn-ship:hover{background:#15803d;}
.pop-btn-reserve{background:var(--purple);color:#fff;}.pop-btn-reserve:hover{background:#6d28d9;}
.pop-btn-cancel-reserve{background:var(--purple-l);color:var(--purple);border:1.5px solid var(--purple-b);}
.pop-btn-secondary{background:var(--surface);color:var(--gray);border:1.5px solid var(--border2);}
.reserve-form{background:var(--purple-l);border:1.5px solid var(--purple-b);border-radius:10px;padding:14px;margin-top:8px;display:none;}
.reserve-form.show{display:block;}
.reserve-form-title{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:10px;}

.staff-chip{padding:6px 12px;border-radius:999px;border:1.5px solid var(--purple-b);background:var(--white);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--purple);transition:all .12s;}
.staff-chip.sel{background:var(--purple);color:#fff;}
.pop-btn-do-reserve{width:100%;padding:10px;border-radius:8px;background:var(--purple);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;margin-top:10px;}
.flex-section{background:var(--teal-l);border:1.5px solid var(--teal-b);border-radius:10px;padding:12px;margin-bottom:12px;}

.flex-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.flex-row:last-child{margin-bottom:0;}

.flex-chip.sel{background:var(--teal);color:#fff;border-color:var(--teal);}

.empty{text-align:center;padding:36px 20px;color:var(--gray);}
.empty .ico{font-size:30px;margin-bottom:8px;}
.empty p{font-size:13px;}
.toast{position:fixed;bottom:18px;right:14px;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transform:translateY(60px);opacity:0;transition:all .3s;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.toast.show{transform:translateY(0);opacity:1;}
.toast.g{background:#16a34a;color:#fff;}.toast.b{background:var(--accent);color:#fff;}
.toast.p{background:var(--purple);color:#fff;}.toast.t{background:var(--teal);color:#fff;}
.toast.r{background:var(--red);color:#fff;}

  .tab-btn{padding:10px 8px;font-size:12px;}

}

  </div>
</header>

<div class="tab-bar">

  <button class="tab-btn" id="tbn-cleaning" onclick="showTab('cleaning',this)">🧼 保管・清掃中 <span class="tc y" id="cnt-cl">0</span></button>
  <button class="tab-btn" id="tbn-return" onclick="showTab('return',this)">📥 返却受付</button>
  <button class="tab-btn" id="tbn-settings" onclick="showTab('settings',this)">⚙️ 設定</button>

<main>

<!-- 出荷可能 -->
<div class="page active" id="tab-available">

    <div class="av-title">出荷可能</div>

  </div>

      <button class="flt-btn" onclick="toggleFlt('motor','2',this)">2M</button>
      <button class="flt-btn" onclick="toggleFlt('motor','3',this)">3M</button>
    </div>
    <div class="filter-row-label">幅</div>
    <div class="filter-row">
      <button class="flt-btn" onclick="toggleFlt('width','83',this)">83cm</button>
      <button class="flt-btn" onclick="toggleFlt('width','91',this)">91cm</button>
    </div>
    <div class="filter-row-label">実費区分・その他</div>
    <div class="filter-row">
      <button class="flt-btn" onclick="toggleFlt('cost','実費対応',this)">✅ 実費対応</button>
      <button class="flt-btn" onclick="toggleFlt('cost','要相談',this)">🔄 要相談</button>
      <button class="flt-btn" onclick="toggleFlt('cost','保険対応のみ',this)">🔵 保険対応のみ</button>
      <button class="flt-btn" onclick="toggleFlt('reserved','1',this)">🔖 予約中</button>
      <button class="flt-btn" onclick="toggleFlt('flexible','1',this)">🔀 可変</button>
      <button class="filter-clear" onclick="clearFilters()">クリア</button>
    </div>
  </div>
  <div id="av-body"></div>
</div>

<!-- 清掃中 -->
<div class="page" id="tab-cleaning">

    <div class="cl-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#dc2626"></div>最優先</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>優先</div>

  </div>

</div>

<!-- 返却受付 -->

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzDAuuI2NMxmOQrplXaHPWugmLf_4mP6Mu6KLQEa6SIrIswetuGoQ8pgYpgtrmwKDXqfg/exec';

    "楽匠":         {motors:[2,3],widths:[83,91],flexible:false,lengths:false,colors:false,defaultCost:"要相談",specText:""},
    "楽匠S":        {motors:[2,3],widths:[83,91],flexible:false,lengths:false,colors:false,defaultCost:"実費対応",specText:""},
    "楽匠Z":        {motors:[2,3],widths:[83,91],flexible:false,lengths:false,colors:false,defaultCost:"保険対応のみ",specText:""},
    "新楽匠":       {motors:[2,3],widths:[83,91],flexible:false,lengths:false,colors:false,defaultCost:"実費対応",specText:""},

  },
  "シーホネンス":{

  },

    "コンフォート":{motors:[2,3],widths:[83,91],flexible:false,lengths:false,colors:false,defaultCost:"要相談",specText:""},

const STAFF=["佐々木","荒木","福田","三井","郷坪","沖藤"];
const COST_LABEL={"実費対応":"✅ 実費対応","要相談":"🔄 要相談","保険対応のみ":"🔵 保険対応のみ"};
const COST_MINI ={"実費対応":"mb-ok","要相談":"mb-ask","保険対応のみ":"mb-ins"};
const COST_HINT_CSS={"実費対応":"h-ok","要相談":"h-ask","保険対応のみ":"h-ng"};
const STATE_EMOJI={"美品":"✨","普通":"👍","程度悪":"⚠️","要修理":"🔧"};
const STATE_MINI ={"美品":"mb-bip","普通":"mb-nor","程度悪":"mb-bad","要修理":"mb-rep"};
const COLOR_BADGE={"白":"cb-white","ピンク":"cb-pink","グリーン":"cb-green"};
const COLOR_EMOJI={"白":"⬜","ピンク":"🩷","グリーン":"💚"};
const PRI_SPECS=[{motor:3,width:91},{motor:3,width:83},{motor:2,width:91},{motor:2,width:83},{motor:1,width:91}];
const PRI_CSS={1:"pri-1",2:"pri-2",3:"pri-3",4:"pri-4"};

const PRI_LBL={1:"🔴 最優先（在庫ゼロ）",2:"🟠 優先",3:"🟡 通常",4:"⚪ 余裕あり"};

let beds=[];
let MASTER=JSON.parse(localStorage.getItem('asport-master')||'null')||DEFAULT_MASTER;
let filters={motor:new Set(),width:new Set(),cost:new Set(),reserved:false,flexible:false};
// 返却受付
let sel={maker:null,series:null,motor:null,width:null,length:null,color:null,state:null,cost:null,note:''};
let popBedId=null,reserveStaff=null,popFlexSel={};
let editingMaker=null,editingSeriesName=null;
let confirmCallback=null;

// 初期化
document.getElementById('hdate').textContent=
  new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'short',day:'numeric',weekday:'short'});
buildMakerChips();
const cache=localStorage.getItem('asport-v12-cache');
if(cache){beds=JSON.parse(cache);renderAll();}
loadFromGAS();

function getMI(maker,series){return MASTER[maker]?.[series]||{};}

// GAS
async function loadFromGAS(){
  showSync('🔄 読み込み中...','gray');
  try{
    const res = await fetch(GAS_URL, {method:'GET', redirect:'follow'});
    const data = await res.json();
    if(Array.isArray(data)){
      // nullデータを除去
      beds=data.filter(b => b.maker && b.series && b.motor && b.width);
      localStorage.setItem('asport-v12-cache',JSON.stringify(beds));
      showSync('✅ 同期済み','green');
      renderAll();
    }
  }catch(e){
    console.warn('GAS接続エラー:',e);
    const c=localStorage.getItem('asport-v12-cache');
    if(c){beds=JSON.parse(c);renderAll();}
    showSync('⚠️ キャッシュ使用中','orange');
  }
  setTimeout(loadFromGAS,30000);
}
// キャッシュ内のnullデータを除去
async function save(){
  // nullデータを除去してから保存
  beds = beds.filter(b => b.maker && b.series && b.motor && b.width);
  try{
    await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',beds})});
    localStorage.setItem('asport-v12-cache',JSON.stringify(beds));
    showSync('✅ 保存済み','green');
  }catch(e){
    localStorage.setItem('asport-v12-cache',JSON.stringify(beds));
    showSync('⚠️ オフライン保存','orange');
  }
}
function clearCache(){

function showSync(msg,color){

// 優先度
function calcScore(bed){
  const av=beds.filter(b=>b.status==='available');
  const same=av.filter(b=>b.motor===bed.motor&&b.width===bed.width).length;
  const clSame=beds.filter(b=>['storage','cleaning'].includes(b.status)&&b.motor===bed.motor&&b.width===bed.width).length;
  let s=0;
  if(same===0)s-=100;else if(same===1)s-=50;else s+=same*10;
  s+=(clSame-1)*15;s-=(bed.motor-1)*5;
  const pi=PRI_SPECS.findIndex(p=>p.motor===bed.motor&&p.width===bed.width);
  if(pi>=0)s-=(PRI_SPECS.length-pi)*3;
  return s;
}
function priLevel(s){return s<=-100?1:s<=-50?2:s<=0?3:4;}

// フィルター
function toggleFlt(type,val,btn){
  if(type==='reserved'||type==='flexible'){
    filters[type]=!filters[type];
    btn.classList.toggle('on',filters[type]);
    btn.classList.toggle('on-p',filters[type]&&type==='reserved');
  }else{
    const set=filters[type];
    if(set.has(val)){set.delete(val);btn.classList.remove('on');}
    else{set.add(val);btn.classList.add('on');}
  }
  renderAvailable();
}
function clearFilters(){
  filters={motor:new Set(),width:new Set(),cost:new Set(),reserved:false,flexible:false};
  document.querySelectorAll('.flt-btn').forEach(b=>b.classList.remove('on','on-p'));
  renderAvailable();
}
function applyFilters(list){
  return list.filter(b=>{
    if(filters.motor.size&&!filters.motor.has(String(b.motor)))return false;
    if(filters.width.size&&!filters.width.has(String(b.width)))return false;
    if(filters.cost.size&&!filters.cost.has(b.cost||'要相談'))return false;
    if(filters.reserved&&!b.reserved)return false;
    if(filters.flexible&&!getMI(b.maker,b.series).flexible)return false;
    return true;
  });
}

  sel.state=s;sel.cost=null;
  document.querySelectorAll('.state-chip').forEach(x=>x.classList.remove('sel'));
  btn.classList.add('sel');done(7,STATE_EMOJI[s]+' '+s);
  openS(8);closeS(9);clv('sv8');clv('sv9');
  // 実費デフォルト
  document.querySelectorAll('.cost-chip').forEach(x=>x.classList.remove('sel'));
  if(sel.series){
    const def=getMI(sel.maker,sel.series).defaultCost||'要相談';
    sel.cost=def;
    document.querySelectorAll('.cost-chip').forEach(x=>x.classList.toggle('sel',x.dataset.cost===def));
    done(8,COST_LABEL[def]);
    const d=document.getElementById('cost-hint-r');
    d.className=`cost-hint-r show ${COST_HINT_CSS[def]}`;
    d.innerHTML=`💡 デフォルト：<strong>${COST_LABEL[def]}</strong>（変更可）`;
  }
  openS(9);clv('sv9');
  updSum();updBtn();
}
function selCost(btn,c){
  sel.cost=c;
  document.querySelectorAll('.cost-chip').forEach(x=>x.classList.remove('sel'));
  btn.classList.add('sel');done(8,COST_LABEL[c]);
  updSum();updBtn();
}
function updIndivMemo(){
  sel.indivMemo=document.getElementById('indiv-memo-input').value;
  const v=sel.indivMemo.trim();
  const el=document.getElementById('sv25');
  if(v){el.textContent=v.length>14?v.slice(0,14)+'…':v;el.style.display='block';}
  else{el.style.display='none';}
}
function updNoteVal(){
  sel.note=document.getElementById('note-input').value;
  const v=sel.note.trim();
  const el=document.getElementById('sv9');
  if(v){el.textContent=v.length>12?v.slice(0,12)+'…':v;el.style.display='block';}
  else{el.style.display='none';}
  updSum();updBtn();
}

function hlChip(gid,btn){
  document.querySelectorAll('#'+gid+' .chip').forEach(c=>c.classList.remove('sel'));
  btn.classList.add('sel');
}
function done(n,v){
  document.getElementById('sn'+n).classList.remove('act');
  document.getElementById('sn'+n).classList.add('done');
  const el=document.getElementById('sv'+n);el.textContent=v;el.style.display='block';
}
function openS(n){
  document.getElementById('sb'+n).classList.remove('locked');
  document.getElementById('sn'+n).classList.add('act');
  document.getElementById('snm'+n).classList.add('act');
}
function closeS(n){
  document.getElementById('sb'+n).classList.add('locked');
  document.getElementById('sn'+n).classList.remove('done','act');
  document.getElementById('snm'+n).classList.remove('act');
  document.querySelectorAll('#sb'+n+' .chip,.state-chip,.cost-chip,.color-chip').forEach(c=>c.classList.remove('sel'));
}
function clv(id){const el=document.getElementById(id);if(el){el.style.display='none';el.textContent='';}}

function updSum(){
  const mi=sel.series?getMI(sel.maker,sel.series):{};
  const parts=[sel.maker,sel.series,
    sel.motor?sel.motor+'モーター':null,
    sel.width?sel.width+'cm':null,
    mi.lengths&&sel.length?sel.length:null,
    
    sel.state?STATE_EMOJI[sel.state]+' '+sel.state:null,
    sel.cost?COST_LABEL[sel.cost]:null,
  ].filter(Boolean);
  document.getElementById('sum-box').innerHTML=parts.length
    ?parts.map((p,i)=>(i>0?'<span style="color:var(--border2)">›</span>':'')+`<span class="sum-tag">${p}</span>`).join('')
    :'<span class="sum-empty">ステップに従って選択してください</span>';
}
function updBtn(){
  const mi=sel.series?getMI(sel.maker,sel.series):{};
  const needLen=mi.lengths;
  document.getElementById('sub-btn').disabled=!(
    sel.maker&&sel.series&&sel.motor&&sel.width&&
    (!needLen||sel.length)&&
    sel.state&&sel.cost
  );
}
function resetForm(){
  sel={maker:null,series:null,motor:null,width:null,length:null,color:null,state:null,cost:null,note:''};
  document.querySelectorAll('.chip,.state-chip,.cost-chip,.color-chip').forEach(c=>c.classList.remove('sel'));
  [1,2,3,4,5,6,7,8,9].forEach(n=>{
    document.getElementById('sn'+n).classList.remove('done','act');
    document.getElementById('snm'+n).classList.remove('act');
    clv('sv'+n);
  });
  document.getElementById('sn1').classList.add('act');document.getElementById('snm1').classList.add('act');
  [2,3,4,5,6,7,8,9].forEach(closeS);
  document.getElementById('sb25').classList.add('locked');
  document.getElementById('indiv-memo-input').value='';
  clv('sv25');
  ['cp-series','cp-motor','cp-width'].forEach(id=>document.getElementById(id).innerHTML='');
  document.getElementById('note-input').value='';
  document.getElementById('cost-hint-r').className='cost-hint-r';
  updSum();updBtn();
}
function doSubmit(){
  const mi=getMI(sel.maker,sel.series);
  beds.unshift({
    id:Date.now(),
    maker:sel.maker,series:sel.series,motor:sel.motor,width:sel.width,
    length:mi.lengths?sel.length:null,
    
    state:sel.state,cost:sel.cost,
    indivMemo:sel.indivMemo?.trim()||null,
    note:sel.note.trim()||null,
    reserved:null,status:'storage',
    returnedAt:new Date().toISOString(),cleaningAt:null,completedAt:null,
  });
  save();renderAll();resetForm();
  toast('📦 一時保管に登録しました','t');
  showTab('cleaning',document.getElementById('tbn-cleaning'));
}

// 設定
function openAddMakerModal(){
  document.getElementById('new-maker-name').value='';
  document.getElementById('add-maker-modal').classList.add('open');
}
function addMaker(){
  const name=document.getElementById('new-maker-name').value.trim();
  if(!name){toast('メーカー名を入力してください','r');return;}
  if(MASTER[name]){toast('すでに存在します','r');return;}
  MASTER[name]={};saveMaster();renderAll();buildMakerChips();
  closePopupById('add-maker-modal');toast('メーカーを追加しました','b');
}
function deleteMakerBtn(btn){showConfirm(`「${btn.dataset.maker}」を削除しますか？`,()=>{delete MASTER[btn.dataset.maker];saveMaster();renderAll();buildMakerChips();toast('削除しました','r');});}
function openEditSeriesModalBtn(btn){openEditSeriesModal(btn.dataset.maker,btn.dataset.series);}
function deleteSeriesBtn(btn){showConfirm(`「${btn.dataset.series}」を削除しますか？`,()=>{delete MASTER[btn.dataset.maker][btn.dataset.series];saveMaster();renderAll();buildMakerChips();toast('削除しました','r');});}

function openAddSeriesModal(maker){
  editingMaker=maker;editingSeriesName=null;
  document.getElementById('series-modal-title').textContent='機種を追加 — '+maker;
  document.getElementById('series-name-input').value='';
  document.getElementById('series-spec-text').value='';
  document.querySelectorAll('#motor-check-group .check-chip,#width-check-group .check-chip').forEach(c=>c.classList.remove('on'));
  document.getElementById('toggle-colors').checked=false;
  document.getElementById('toggle-lengths').checked=false;
  document.getElementById('toggle-flexible').checked=false;
  document.getElementById('default-cost-select').value='要相談';
  document.getElementById('add-series-modal').classList.add('open');
}
function openEditSeriesModal(maker,series){
  editingMaker=maker;editingSeriesName=series;
  const m=MASTER[maker][series];
  document.getElementById('series-modal-title').textContent='機種を編集 — '+series;
  document.getElementById('series-name-input').value=series;
  document.getElementById('series-spec-text').value=m.specText||'';
  document.querySelectorAll('#motor-check-group .check-chip').forEach(c=>{c.classList.toggle('on',m.motors.includes(parseInt(c.textContent)));});
  document.querySelectorAll('#width-check-group .check-chip').forEach(c=>{c.classList.toggle('on',m.widths.includes(parseInt(c.textContent)));});
  document.getElementById('toggle-colors').checked=!!m.colors;
  document.getElementById('toggle-lengths').checked=!!m.lengths;
  document.getElementById('toggle-flexible').checked=!!m.flexible;
  document.getElementById('default-cost-select').value=m.defaultCost||'要相談';
  document.getElementById('add-series-modal').classList.add('open');
}
function toggleCheck(btn){btn.classList.toggle('on');}
function saveSeries(){
  const name=document.getElementById('series-name-input').value.trim();
  if(!name){toast('機種名を入力してください','r');return;}
  const motors=[...document.querySelectorAll('#motor-check-group .check-chip.on')].map(c=>parseInt(c.textContent));
  const widths=[...document.querySelectorAll('#width-check-group .check-chip.on')].map(c=>parseInt(c.textContent));
  if(!motors.length){toast('モーター数を選択してください','r');return;}
  if(!widths.length){toast('幅を選択してください','r');return;}
  const specText=document.getElementById('series-spec-text').value.trim();
  const colors=document.getElementById('toggle-colors').checked;
  const lengths=document.getElementById('toggle-lengths').checked;
  const flexible=document.getElementById('toggle-flexible').checked;
  const defaultCost=document.getElementById('default-cost-select').value;
  if(editingSeriesName&&editingSeriesName!==name)delete MASTER[editingMaker][editingSeriesName];
  MASTER[editingMaker][name]={motors,widths,flexible,lengths,colors,defaultCost,specText};
  saveMaster();renderAll();buildMakerChips();
  closePopupById('add-series-modal');toast('機種を保存しました','b');
}

// 確認モーダル
function showConfirm(msg,callback){
  document.getElementById('confirm-msg').textContent=msg;
  confirmCallback=callback;
  document.getElementById('confirm-ok-btn').onclick=function(){closePopupById('confirm-modal');if(confirmCallback)confirmCallback();};
  document.getElementById('confirm-modal').classList.add('open');
}

// ユーティリティ
function fmt(iso){
  if(!iso)return'—';
  const d=new Date(iso);
  return d.toLocaleDateString('ja-JP',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}
function showTab(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='settings')renderSettings();
}
function closePopupById(id){document.getElementById(id).classList.remove('open');}
function toast(msg,type='g'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'),3000);
}
document.querySelectorAll('.popup').forEach(p=>{
  p.addEventListener('click',e=>{if(e.target===p)p.classList.remove('open');});
});
</script>
</body>
</html>
