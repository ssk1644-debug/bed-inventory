<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福祉用具購入 申請書類作成 | アスポート</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap');
:root{
  --bg:#f0f4f8;--white:#fff;--surface:#f8fafc;
  --border:#e2e8f0;--border2:#cbd5e1;
  --accent:#0ea5e9;--accent-dark:#0284c7;
  --green:#16a34a;--green-l:#f0fdf4;--green-b:#86efac;
  --red:#dc2626;--red-l:#fef2f2;--red-b:#fecaca;
  --purple:#7c3aed;--purple-l:#f5f3ff;--purple-b:#ddd6fe;
  --gray:#64748b;--gray2:#94a3b8;--text:#0f172a;--text2:#475569;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;}
header{background:var(--white);border-bottom:1px solid var(--border);padding:0 16px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.logo{font-size:15px;font-weight:700;color:var(--accent-dark);}
.logo .sub{font-size:12px;color:var(--gray);font-weight:400;margin-left:6px;}
.ver{font-size:10px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:999px;margin-left:4px;}
main{max-width:860px;margin:0 auto;padding:16px 16px 80px;}
.sec{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
.sec-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr;}}
.fld{margin-bottom:12px;}
.fld label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;display:block;}
.input,.select,.textarea{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid var(--border2);background:var(--white);font-size:14px;font-family:inherit;color:var(--text);outline:none;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);}
.textarea{resize:vertical;}
.row{display:flex;gap:8px;align-items:center;}
.row .input{flex:1;}
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none;display:inline-flex;align-items:center;gap:5px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-purple{background:var(--purple);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-ghost{background:var(--surface);color:var(--gray);border:1px solid var(--border2);}
.btn-red{background:var(--red-l);color:var(--red);border:1px solid var(--red-b);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-big{width:100%;padding:14px;font-size:15px;font-weight:700;justify-content:center;}
.item-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;position:relative;}
.item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.item-num{font-size:13px;font-weight:700;color:var(--accent-dark);}
.photo-area{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.photo-thumb{width:74px;height:74px;border-radius:8px;border:1px solid var(--border2);object-fit:cover;position:relative;}
.photo-wrap{position:relative;}
.photo-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:11px;cursor:pointer;line-height:1;}
.gen-row{display:flex;gap:8px;margin-bottom:6px;}
.gen-row .input{flex:1;}
.hint-text{font-size:11px;color:var(--gray);margin-top:3px;}
.staff-chips{display:flex;flex-wrap:wrap;gap:6px;}
.staff-chip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--border2);background:var(--white);font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);font-family:inherit;}
.staff-chip.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.toast{position:fixed;bottom:18px;right:14px;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transform:translateY(60px);opacity:0;transition:.3s;background:var(--accent);color:#fff;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.r{background:var(--red);}
.toast.g{background:var(--green);}
.print-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;justify-content:center;z-index:60;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 印刷書類 ===== */
#print-root{display:none;}
.doc{background:#fff;width:210mm;min-height:297mm;padding:14mm 13mm;margin:0 auto 20px;font-family:'Noto Serif JP','Noto Sans JP',serif;color:#000;position:relative;}
.doc-title{text-align:center;font-size:15pt;font-weight:700;margin-bottom:5mm;letter-spacing:.05em;}
.dtable{width:100%;border-collapse:collapse;}
.dtable th,.dtable td{border:1.2px solid #000;padding:2.2mm 2.5mm;font-size:10.5pt;vertical-align:middle;}
.dtable th{background:#f2f2f2;font-weight:600;text-align:center;}
.num-boxes{display:flex;}
.num-box{width:6.4mm;height:8mm;border:1px solid #000;border-right:none;display:flex;align-items:center;justify-content:center;font-size:11pt;font-weight:600;}
.num-box:last-child{border-right:1px solid #000;}
.reason-box{font-size:9.5pt;line-height:1.55;padding:2mm 2.5mm;}
.doc-note{font-size:8.5pt;line-height:1.5;margin-top:3mm;}
.sig-line{display:flex;align-items:baseline;gap:4mm;margin:1.5mm 0;font-size:10.5pt;}
.checkbox{display:inline-block;width:3.6mm;height:3.6mm;border:1.2px solid #000;margin-right:1.5mm;vertical-align:-0.5mm;position:relative;}
.checkbox.checked::after{content:'✓';position:absolute;top:-1.6mm;left:0.1mm;font-size:4mm;font-weight:700;}
.photo-page-grid{display:flex;flex-wrap:wrap;gap:8mm;justify-content:center;align-items:flex-start;}
.photo-item{text-align:center;}
.photo-item img{max-width:170mm;max-height:200mm;border:1px solid #999;object-fit:contain;}
.photo-item.half img{max-width:82mm;max-height:110mm;}
.photo-cap{font-size:10pt;font-weight:600;margin-top:2mm;font-family:'Noto Sans JP',sans-serif;}

@media print{
  body{background:#fff;}
  header,main,.print-bar,.toast{display:none !important;}
  #print-root{display:block;}
  .doc{width:auto;min-height:auto;margin:0;padding:10mm 11mm;page-break-after:always;}
  .doc:last-child{page-break-after:auto;}
  @page{size:A4;margin:0;}
}
</style>
</head>
<body>

<header>
  <div class="logo">📄 福祉用具購入 申請書類作成 <span class="sub">アスポート</span><span class="ver">v1.0</span></div>
  <button class="btn btn-ghost btn-sm" onclick="clearAll()">🗑 入力クリア</button>
</header>

<main>

<!-- 利用者情報 -->
<div class="sec">
  <div class="sec-title">👤 利用者情報</div>
  <div class="grid2">
    <div class="fld"><label>フリガナ</label><input class="input" id="u-kana" placeholder="トガワ カズコ"></div>
    <div class="fld"><label>氏名 *</label><input class="input" id="u-name" placeholder="戸川 和子"></div>
  </div>
  <div class="fld"><label>生年月日</label>
    <div class="row">
      <select class="select" id="u-era" style="width:90px;">
        <option>明治</option><option>大正</option><option selected>昭和</option><option>平成</option><option>令和</option>
      </select>
      <input class="input" id="u-by" placeholder="15" style="width:70px;" inputmode="numeric">年
      <input class="input" id="u-bm" placeholder="3" style="width:60px;" inputmode="numeric">月
      <input class="input" id="u-bd" placeholder="15" style="width:60px;" inputmode="numeric">日
    </div>
  </div>
  <div class="fld"><label>被保険者住所 *</label><input class="input" id="u-addr" placeholder="広島県 福山市 東吉津町6番29-206号"></div>
  <div class="grid2">
    <div class="fld"><label>被保険者番号（10桁）*</label><input class="input" id="u-hoken" placeholder="0000872266" maxlength="10" inputmode="numeric"></div>
    <div class="fld"><label>電話番号</label><input class="input" id="u-tel" placeholder="084-924-3050"></div>
  </div>
</div>

<!-- 商品 -->
<div class="sec">
  <div class="sec-title">🛒 購入商品（最大5品目）</div>
  <div id="items"></div>
  <button class="btn btn-ghost" onclick="addItem()">＋ 商品を追加</button>
</div>

<!-- 申請・担当情報 -->
<div class="sec">
  <div class="sec-title">🏢 申請・担当情報</div>
  <div class="grid2">
    <div class="fld"><label>購入日 *</label><input class="input" type="date" id="buy-date"></div>
    <div class="fld"><label>申請日（空欄可）</label><input class="input" type="date" id="apply-date"></div>
  </div>
  <div class="fld"><label>担当者 *</label>
    <div class="staff-chips" id="staff-chips"></div>
  </div>
</div>

<!-- 確認シート情報 -->
<div class="sec">
  <div class="sec-title">✅ 適合確認シート情報</div>
  <div class="grid3">
    <div class="fld"><label>使用前点検日</label><input class="input" type="date" id="check-date"></div>
    <div class="fld"><label>導入日</label><input class="input" type="date" id="intro-date"></div>
    <div class="fld"><label>導入10日後 確認日</label><input class="input" type="date" id="after-date"></div>
  </div>
  <div class="grid2">
    <div class="fld"><label>利用者(代理人)署名欄の名前（空欄可＝手書き）</label><input class="input" id="sign-name" placeholder="空欄なら印刷後に手書き"></div>
    <div class="fld"><label>10日後の使用状況</label><input class="input" id="usage-text" value="転倒なく使用しております"></div>
  </div>
</div>

<div style="height:8px;"></div>
</main>

<div class="print-bar">
  <button class="btn btn-primary btn-big" style="max-width:400px;" onclick="doPrint()">🖨 書類一式を作成して印刷</button>
</div>
<div id="print-root"></div>
<div class="toast" id="toast"></div>

<script>
const STAFF=["佐々木 浩","荒木","福田","三井","郷坪","沖藤"];
const COMPANY={
  name:"アスポート", rep:"佐々木 浩",
  addr:"広島県福山市引野町南一丁目１８番２５号",
  tel:"084-971-8882", jigyoNo:"3471500771"
};
const CATEGORIES=["入浴補助用具","腰掛便座","簡易浴槽","スロープ","歩行器","歩行補助つえ","排泄支援予測機器","移動用リフトのつり具部分","自動排泄処理装置の交換可能部品"];

let items=[]; // {cat,name,maker,price,keywords,reason,photos:[dataURL]}
let selStaff=null;

// ===== 初期化 =====
document.getElementById('staff-chips').innerHTML=STAFF.map(s=>`<button class="staff-chip" onclick="pickStaff(this,'${s}')">${s}</button>`).join('');
const today=new Date().toISOString().split('T')[0];
document.getElementById('buy-date').value=today;
document.getElementById('check-date').value=today;
document.getElementById('intro-date').value=today;

loadDraft();
if(items.length===0) addItem();
renderItems();

function pickStaff(btn,name){
  selStaff=name;
  document.querySelectorAll('.staff-chip').forEach(c=>c.classList.remove('sel'));
  btn.classList.add('sel');
  saveDraft();
}

// ===== 商品 =====
function addItem(){
  if(items.length>=5){toast('商品は最大5品目までです','r');return;}
  items.push({cat:"入浴補助用具",name:"",maker:"",price:"",keywords:"",reason:"",photos:[]});
  renderItems();
}
function removeItem(i){
  items.splice(i,1);
  renderItems();saveDraft();
}
function renderItems(){
  const el=document.getElementById('items');
  el.innerHTML=items.map((it,i)=>`
  <div class="item-card">
    <div class="item-head">
      <div class="item-num">商品 ${i+1}</div>
      ${items.length>1?`<button class="btn btn-red btn-sm" onclick="removeItem(${i})">削除</button>`:''}
    </div>
    <div class="grid2">
      <div class="fld"><label>種目名</label>
        <select class="select" onchange="items[${i}].cat=this.value;saveDraft()">
          ${CATEGORIES.map(c=>`<option${c===it.cat?' selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="fld"><label>製造事業者名（メーカー）*</label><input class="input" value="${esc(it.maker)}" placeholder="アロン化成" oninput="items[${i}].maker=this.value;saveDraft()"></div>
    </div>
    <div class="grid2">
      <div class="fld"><label>商品名 *</label><input class="input" value="${esc(it.name)}" placeholder="安寿 浴槽手すりUST-130N" oninput="items[${i}].name=this.value;saveDraft()"></div>
      <div class="fld"><label>購入金額（円・税込）*</label><input class="input" value="${esc(it.price)}" placeholder="39600" inputmode="numeric" oninput="items[${i}].price=this.value;saveDraft()"></div>
    </div>
    <div class="fld"><label>必要な理由 — キーワード入力 → 文章生成</label>
      <div class="gen-row">
        <input class="input" value="${esc(it.keywords)}" placeholder="例：第一腰椎圧迫骨折、前屈で強い痛み、浴槽またぎ不安定" oninput="items[${i}].keywords=this.value;saveDraft()">
        <button class="btn btn-purple" id="gen-btn-${i}" onclick="genReason(${i})">✨ 生成</button>
      </div>
      <textarea class="textarea" rows="3" placeholder="生成された文章（編集できます）" oninput="items[${i}].reason=this.value;saveDraft()">${esc(it.reason)}</textarea>
      <div class="hint-text">診断名・症状・困っている動作をキーワードで入れて「生成」を押してください</div>
    </div>
    <div class="fld"><label>カタログ写真（複数可）</label>
      <input type="file" accept="image/*" multiple onchange="addPhotos(${i},this)">
      <div class="photo-area">
        ${it.photos.map((p,pi)=>`<div class="photo-wrap"><img class="photo-thumb" src="${p}"><button class="photo-del" onclick="delPhoto(${i},${pi})">×</button></div>`).join('')}
      </div>
    </div>
  </div>`).join('');
  // 担当者チップ再選択
  document.querySelectorAll('.staff-chip').forEach(c=>c.classList.toggle('sel',c.textContent===selStaff));
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function addPhotos(i,input){
  const files=[...input.files];
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      // 縮小してデータ量を抑える
      const img=new Image();
      img.onload=()=>{
        const maxW=1400;
        const scale=Math.min(1,maxW/img.width);
        const cv=document.createElement('canvas');
        cv.width=img.width*scale;cv.height=img.height*scale;
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        items[i].photos.push(cv.toDataURL('image/jpeg',0.85));
        renderItems();saveDraft();
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(f);
  });
  input.value='';
}
function delPhoto(i,pi){items[i].photos.splice(pi,1);renderItems();saveDraft();}

// ===== 理由文生成（AI呼び出し + フォールバック） =====
async function genReason(i){
  const kw=items[i].keywords.trim();
  if(!kw){toast('キーワードを入力してください','r');return;}
  const btn=document.getElementById('gen-btn-'+i);
  btn.innerHTML='<span class="spinner"></span>';btn.disabled=true;
  let text=null;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,
        messages:[{role:"user",content:
`介護保険の福祉用具購入費支給申請書の「福祉用具が必要な理由」欄の文章を1つ作成してください。
商品：${items[i].name||items[i].cat}
キーワード：${kw}
条件：
- 2〜3文、120〜180字程度
- 「〜により、〜があり、〜が不安定になっている。〜するためには〜が必要である。」のような役所向けの硬い文体
- 診断名→症状→困難な動作→商品の効果と必要性 の順
- 文章のみを出力（前置き・記号・改行装飾なし）`}]})
    });
    const data=await res.json();
    if(data && data.content){
      text=data.content.filter(c=>c.type==='text').map(c=>c.text).join('').trim();
    }
  }catch(e){ /* オフライン・GitHub Pages では自動組み立てに切替 */ }
  if(!text) text=buildReason(kw, items[i].name||items[i].cat);
  items[i].reason=text;
  renderItems();saveDraft();
  btn.innerHTML='✨ 生成';btn.disabled=false;
  toast('文章を生成しました（編集できます）','g');
}

// キーワードからの自動組み立て（AI接続不可時）
function buildReason(kw, product){
  const parts=kw.split(/[、,，\s]+/).filter(x=>x);
  const diag=[],symp=[],diff=[];
  parts.forEach(p=>{
    if(/骨折|症$|病|梗塞|麻痺|損傷|ヘルニア|パーキンソン|骨粗鬆/.test(p)) diag.push(p);
    else if(/痛み|痛|低下|減少|ふらつき|しびれ|筋力|活動量/.test(p)) symp.push(p);
    else diff.push(p);
  });
  const effect=productEffect(product);
  let s='';
  if(diag.length) s+=diag.join('および')+'により、';
  if(symp.length) s+=symp.join('、')+'があり、';
  if(diff.length) s+=diff.join('や')+'が不安定になっている。';
  else s+='日常動作が不安定になっている。';
  s+=effect;
  return s;
}
function productEffect(product){
  const p=product||'';
  if(/浴槽台/.test(p)) return '浴槽の高低差を緩和し、浴槽内で安定した座位姿勢を確保するためには浴槽台が必要である。';
  if(/手すり/.test(p)) return '浴槽への出入り時に安定した支持が得られ、安全にまたぐためには浴槽手すりが必要である。';
  if(/シャワーチェア|チェア/.test(p)) return 'シャワーチェアを使用し安定した座位姿勢を確保する事で転倒無く入浴することが可能になる。';
  if(/便座/.test(p)) return '便座からの立ち座りを安全に行うためには腰掛便座が必要である。';
  if(/歩行器/.test(p)) return '歩行時の安定性を確保し安全に移動するためには歩行器が必要である。';
  if(/つえ|杖/.test(p)) return '歩行時のバランスを補助し転倒を防ぐためには歩行補助つえが必要である。';
  return '安全に日常動作を行うためには本用具が必要である。';
}

// ===== 日付ユーティリティ =====
function toWareki(dstr){
  if(!dstr) return {era:'令和',y:'',m:'',d:'',text:''};
  const d=new Date(dstr+'T00:00:00');
  const y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();
  let era='令和',ey=y-2018;
  if(y<2019){era='平成';ey=y-1988;}
  return {era,y:ey,m,d:dd,text:`${era}${ey}年${m}月${dd}日`,seireki:`${y}年${m}月${dd}日`};
}
function fmtSeireki(dstr){
  if(!dstr) return '　　年　　月　　日';
  const d=new Date(dstr+'T00:00:00');
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function numBoxes(str,n){
  const s=String(str||'').replace(/\D/g,'');
  let h='<div class="num-boxes">';
  for(let i=0;i<n;i++) h+=`<div class="num-box">${s[i]||''}</div>`;
  return h+'</div>';
}
function yen(v){
  const n=parseInt(String(v).replace(/\D/g,''))||0;
  return n.toLocaleString();
}

// ===== 印刷 =====
function doPrint(){
  const name=document.getElementById('u-name').value.trim();
  if(!name){toast('利用者氏名を入力してください','r');return;}
  if(!selStaff){toast('担当者を選択してください','r');return;}
  const validItems=items.filter(it=>it.name.trim());
  if(!validItems.length){toast('商品を1件以上入力してください','r');return;}
  buildDocs(validItems);
  setTimeout(()=>window.print(),300);
}

function buildDocs(vItems){
  const root=document.getElementById('print-root');
  const kana=document.getElementById('u-kana').value.trim();
  const name=document.getElementById('u-name').value.trim();
  const era=document.getElementById('u-era').value;

// ===== 下書き保存 =====
function saveDraft(){
  const d={
    kana:v('u-kana'),name:v('u-name'),era:v('u-era'),by:v('u-by'),bm:v('u-bm'),bd:v('u-bd'),
    addr:v('u-addr'),hoken:v('u-hoken'),tel:v('u-tel'),
    buyDate:v('buy-date'),applyDate:v('apply-date'),checkDate:v('check-date'),introDate:v('intro-date'),afterDate:v('after-date'),
    signName:v('sign-name'),usage:v('usage-text'),
    staff:selStaff,items
  };
  try{localStorage.setItem('asport-shinsei',JSON.stringify(d));}catch(e){}
}
function v(id){const e=document.getElementById(id);return e?e.value:'';}
function sv(id,val){const e=document.getElementById(id);if(e&&val!==undefined&&val!==null)e.value=val;}
function loadDraft(){
  try{
    const d=JSON.parse(localStorage.getItem('asport-shinsei')||'null');
    if(!d)return;
    sv('u-kana',d.kana);sv('u-name',d.name);sv('u-era',d.era);sv('u-by',d.by);sv('u-bm',d.bm);sv('u-bd',d.bd);
    sv('u-addr',d.addr);sv('u-hoken',d.hoken);sv('u-tel',d.tel);
    sv('buy-date',d.buyDate);sv('apply-date',d.applyDate);sv('check-date',d.checkDate);sv('intro-date',d.introDate);sv('after-date',d.afterDate);
    sv('sign-name',d.signName);sv('usage-text',d.usage);
    selStaff=d.staff||null;
    if(Array.isArray(d.items)) items=d.items;
  }catch(e){}
}
['u-kana','u-name','u-era','u-by','u-bm','u-bd','u-addr','u-hoken','u-tel','buy-date','apply-date','check-date','intro-date','after-date','sign-name','usage-text'].forEach(id=>{
  const e=document.getElementById(id);
  if(e) e.addEventListener('input',saveDraft);
});

function clearAll(){
  if(!confirm('入力内容を全てクリアしますか？'))return;
  localStorage.removeItem('asport-shinsei');
  location.reload();
}

function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(type||'');
  setTimeout(()=>t.classList.remove('show'),3000);
}
